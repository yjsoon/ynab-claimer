name = "receipt-upload"
main = "worker/index.ts"
compatibility_date = "2024-01-01"

# Custom domain
routes = [
  { pattern = "receipts.soon.sg/*", zone_name = "soon.sg" }
]

# R2 bucket binding - create bucket first with: wrangler r2 bucket create receipts
[[r2_buckets]]
binding = "RECEIPTS"
bucket_name = "receipts"

# KV namespace for Xero OAuth tokens (rotating refresh token + tenant id).
# Created with: npx wrangler kv namespace create XERO_TOKENS
[[kv_namespaces]]
binding = "XERO_TOKENS"
id = "2435b070b98e4ac89312e6d784d66af0"

# Non-secret Xero config. Secrets (XERO_CLIENT_ID, XERO_CLIENT_SECRET) are set
# via `wrangler secret put` (prod) or .dev.vars (local) — never committed.
[vars]
XERO_SCOPES = "openid profile email accounting.transactions accounting.contacts accounting.attachments accounting.settings.read offline_access"
XERO_INPUT_TAXTYPE = "INPUTY24"

# Serve static files from src/
[site]
bucket = "./src"
